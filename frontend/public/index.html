<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="description" content="Censorship resistant bounties">
    <title>Simple Bounty</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">

    <!-- Open Graph -->
    <meta property="og:title" content="Simple Bounty">
    <meta property="og:description" content="Censorship resistant bounties">
    <meta property="og:site_name" content="Simple Bounty">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Simple Bounty">
    <meta name="twitter:description" content="Censorship resistant bounties">

    <!-- CSS Preload Pattern -->
    <% for (const cssFile of htmlWebpackPlugin.files.css || []) { %>
    <link rel="preload" href="<%= cssFile %>" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="<%= cssFile %>"></noscript>
    <% } %>

    <!-- JavaScript files -->
    <% for (const jsFile of htmlWebpackPlugin.files.js || []) { %>
    <script src="<%= jsFile %>" defer></script>
    <% } %>
    
    <style>
      /* Hide scrollbars but allow scrolling */
      * {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      *::-webkit-scrollbar {
        display: none;  /* Chrome, Safari and Opera */
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch; /* Smooth scrolling on iOS */
        touch-action: pan-y;
      }
      #root {
        min-height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
